dataset: mini_swe_agent
runner: llm
use_cache: true
paths:
  input: annotation/samples
  normalized_dir: agentic_review_annotation_distilabel/data/normalized
  normalized_preview_dir: agentic_review_annotation_distilabel/data/normalized_preview
  output_dir: agentic_review_annotation_distilabel/data/auto_annotations
  cache_dir: agentic_review_annotation_distilabel/.distilabel_cache
model:
  # Environment variables override these values:
  # - AGENTIC_REVIEW_API_KEY or OPENAI_API_KEY
  # - AGENTIC_REVIEW_MODEL
  # - AGENTIC_REVIEW_BASE_URL or OPENAI_BASE_URL
  api_key: null
  model: gpt-4.1
  base_url: https://api.openai.com/v1
  temperature: 0.0
  max_new_tokens: 4096
  timeout_seconds: 120
  max_retries: 2
  # For DeepSeek V4 Chat Completions, thinking mode is enabled by default.
  # JSON annotation usually works better and costs less with thinking disabled.
  extra_body:
    thinking:
      type: disabled
prompt_budget:
  compact_for_model: false
  max_task_chars: 12000
  max_patch_chars: 20000
  max_step_chars: 6000
  max_total_step_chars: 60000
